  <text x="232" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Mechanical Board</text>
  <text x="232" y="312" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10b981">$189.00</text>
  <rect x="337" y="298" width="30" height="20" rx="4" fill="#0d4736"/>
  <text x="352" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Card 3 -->
  <rect x="405" y="185" width="165" height="160" rx="8" fill="#16201b" stroke="#25352c" stroke-width="1"/>
  <rect x="420" y="200" width="135" height="75" rx="6" fill="#202c25"/>
  <circle cx="487" cy="237" r="26" fill="#10b981" fill-opacity="0.2"/>
  <text x="420" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Minimalist Desk Pad</text>
  <text x="420" y="312" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10b981">$49.00</text>
