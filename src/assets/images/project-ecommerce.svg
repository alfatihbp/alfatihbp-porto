      <stop offset="0%" stop-color="#0a0f0d" />
      <stop offset="100%" stop-color="#111814" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="375" fill="url(#bg)"/>
  
  <!-- Browser Chrome Header -->
  <rect width="600" height="36" fill="#16201b"/>
