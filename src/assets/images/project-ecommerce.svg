  <rect x="150" y="298" width="30" height="20" rx="4" fill="#0d4736"/>
  <text x="165" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Card 2 -->
  <rect x="217" y="185" width="165" height="160" rx="8" fill="#16201b" stroke="#25352c" stroke-width="1"/>
