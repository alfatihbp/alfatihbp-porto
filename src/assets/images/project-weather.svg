<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1410" />
      <stop offset="100%" stop-color="#052018" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="375" fill="url(#bgWeather)"/>
  
  <!-- Main Weather Card -->
  <rect x="40" y="40" width="240" height="295" rx="16" fill="#0d4736" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="160" cy="115" r="38" fill="#facc15" fill-opacity="0.9"/>
  <path d="M175 140 C175 125 195 115 210 125 C225 115 245 130 240 145 Z" fill="#ffffff" fill-opacity="0.7"/>
  
  <text x="160" y="200" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">28°C</text>
  <text x="160" y="225" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle">Jakarta, Indonesia</text>
  <text x="160" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">Partly Cloudy • Hum 74%</text>

  <!-- Forecast Analytics Panel -->
  <rect x="305" y="40" width="255" height="140" rx="12" fill="#111c16" stroke="#23352a" stroke-width="1"/>
  <text x="325" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Weekly Temperature Curve</text>
  
  <!-- Line graph -->
  <path d="M330 140 Q 370 100, 410 120 T 480 90 T 530 110" fill="none" stroke="#10b981" stroke-width="3"/>
  <circle cx="480" cy="90" r="5" fill="#10b981"/>
  <text x="480" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">31°</text>

  <!-- Stats Grid -->
  <rect x="305" y="195" width="120" height="140" rx="12" fill="#111c16" stroke="#23352a" stroke-width="1"/>
  <text x="325" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#9ca8a1">Wind Speed</text>
  <text x="325" y="255" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">14 km/h</text>
  <text x="325" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">SW • Normal</text>

  <rect x="440" y="195" width="120" height="140" rx="12" fill="#111c16" stroke="#23352a" stroke-width="1"/>
  <text x="460" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#9ca8a1">UV Index</text>
  <text x="460" y="255" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#facc15">5.2</text>
  <text x="460" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#9ca8a1">Moderate</text>
</svg>

