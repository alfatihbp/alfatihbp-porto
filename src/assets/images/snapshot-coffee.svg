<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#0c1310"/>
  
  <!-- Desk surface texture -->
  <line x1="0" y1="150" x2="400" y2="150" stroke="#16201b" stroke-width="2"/>
  
  <!-- Notebook / Sketchbook -->
  <g transform="translate(140, 45) rotate(6)">
    <rect width="180" height="210" rx="6" fill="#f8fafc" stroke="#e2e8e4" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
    <rect x="20" y="25" width="140" height="8" rx="4" fill="#0d4736"/>
    <rect x="20" y="45" width="120" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="20" y="60" width="130" height="6" rx="3" fill="#cbd5e1"/>
    <!-- Wireframe drawing in notebook -->
    <rect x="20" y="85" width="140" height="75" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="30" y="95" width="55" height="55" rx="3" fill="#0d4736" fill-opacity="0.2"/>
    <rect x="95" y="98" width="55" height="6" rx="2" fill="#0d4736"/>
    <rect x="95" y="110" width="45" height="4" rx="2" fill="#94a3b8"/>
    <rect x="95" y="120" width="50" height="4" rx="2" fill="#94a3b8"/>
    <rect x="20" y="175" width="80" height="18" rx="9" fill="#10b981"/>
    <text x="60" y="188" font-family="sans-serif" font-size="9" font-weight="bold" fill="#05241b" text-anchor="middle">IDEA #42</text>
  </g>
  
  <!-- Ceramic Coffee Cup with Forest Green glaze -->
  <g transform="translate(45, 95)">
    <!-- Saucer -->
    <ellipse cx="60" cy="90" rx="50" ry="20" fill="#16201b" stroke="#25352c" stroke-width="2"/>
    <!-- Cup -->
    <path d="M25 45 C25 80 40 85 60 85 C80 85 95 80 95 45 Z" fill="#0d4736" stroke="#10b981" stroke-width="1.5"/>
    <!-- Handle -->
    <path d="M95 50 C110 50 110 75 95 75" fill="none" stroke="#0d4736" stroke-width="6" stroke-linecap="round"/>
    <!-- Coffee surface -->
    <ellipse cx="60" cy="45" rx="35" ry="12" fill="#2d1d14"/>
    <ellipse cx="60" cy="45" rx="25" ry="8" fill="#4a2e20"/>
    <path d="M50 45 Q 60 40, 70 45" stroke="#fef08a" stroke-width="1.5" fill="none" stroke-opacity="0.5"/>
    
    <!-- Steam -->
    <path d="M50 30 Q 45 15, 55 5" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    <path d="M70 28 Q 75 18, 68 5" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
  </g>
</svg>

